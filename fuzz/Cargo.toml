[package]
name = "crossfade-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
crossfade-core = { path = "../crates/crossfade-core" }
crossfade-codec = { path = "../crates/crossfade-codec" }
crossfade-format = { path = "../crates/crossfade-format" }
crossfade-flac = { path = "../crates/crossfade-flac" }
crossfade-aac = { path = "../crates/crossfade-aac", features = ["decoder"] }
crossfade-vorbis = { path = "../crates/crossfade-vorbis" }
crossfade-opus = { path = "../crates/crossfade-opus" }
crossfade-alac = { path = "../crates/crossfade-alac" }
crossfade-mp3 = { path = "../crates/crossfade-mp3" }
crossfade-loudness = { path = "../crates/crossfade-loudness" }
crossfade-resample = { path = "../crates/crossfade-resample" }
crossfade-graph = { path = "../crates/crossfade-graph" }
serde_json = "1"

# Not a member of the engine workspace: libFuzzer is C++.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rational_ops"
path = "fuzz_targets/rational_ops.rs"
test = false
doc = false
bench = false

