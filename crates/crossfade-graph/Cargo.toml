[package]
name = "crossfade-graph"
description = "Processing graph that wires Crossfade formats, codecs and DSP together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossfade-core.workspace = true
crossfade-format.workspace = true
crossfade-codec.workspace = true
crossfade-dsp.workspace = true
serde = { workspace = true, features = ["derive"] }
# Job files hold times and levels as floats; they must read back to the same bits.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
crossfade-loudness.workspace = true
crossfade-resample.workspace = true
insta.workspace = true
libm.workspace = true
crossfade-testkit.workspace = true
criterion.workspace = true
proptest.workspace = true

[features]
aac = ["crossfade-codec/aac"]

[lints]
workspace = true

[[bench]]
name = "convert"
harness = false
