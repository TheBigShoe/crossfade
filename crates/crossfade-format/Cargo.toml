[package]
name = "crossfade-format"
description = "Container demuxers and muxers for Crossfade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossfade-core.workspace = true
# Demuxers split packets with the FLAC crate's frame-header parser, as libavformat uses
# libavcodec's parsers.
crossfade-flac.workspace = true
# The MP4 reader checks an ALAC track's config and takes its channel layout from it.
crossfade-alac.workspace = true
# The Ogg Vorbis mapping parses the headers and times packets by their block sizes.
crossfade-vorbis.workspace = true

[lints]
workspace = true

[dev-dependencies]
crossfade-testkit.workspace = true
# Tests, examples and benches build engine decoders and encoders.
crossfade-codec.workspace = true
proptest.workspace = true
criterion.workspace = true
# Conformance tier only; dev-dependencies do not count against the engine purity gate.
crossfade-corpus = { path = "../crossfade-corpus" }
sha2.workspace = true
# The Vorbis conformance tier compares the decoder with lewton (MIT/Apache) on the same packets.
lewton = { version = "=0.10.2", default-features = false }

[[bench]]
name = "audio"
harness = false
