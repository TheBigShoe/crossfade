[package]
name = "crossfade-format"
description = "Container demuxers and muxers for Crossfade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossfade-core.workspace = true
# Demuxers split packets with a codec's frame-header parser, as libavformat uses libavcodec's.
crossfade-codec.workspace = true

[lints]
workspace = true

[dev-dependencies]
crossfade-testkit.workspace = true
proptest.workspace = true
criterion.workspace = true
# Conformance tier only; dev-dependencies do not count against the engine purity gate.
crossfade-corpus = { path = "../crossfade-corpus" }
sha2.workspace = true

[[bench]]
name = "audio"
harness = false
