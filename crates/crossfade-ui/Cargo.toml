[package]
name = "crossfade-ui"
description = "The Crossfade desktop app: GPUI shell, chrome and screenshot harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "crossfade-gui"
path = "src/main.rs"

[dependencies]
# gpui-kit re-exports GPUI and its macros resolve through it, so GPUI is not listed
# separately. Code reaches all of it through `prelude`.
gpui-kit.workspace = true
appconfig.workspace = true
# The config watcher thread sends on it; a background task drains it for the UI.
crossbeam-channel.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
crossfade-app.workspace = true
crossfade-core.workspace = true
crossfade-graph.workspace = true
async-channel.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
crossfade-cli.workspace = true
crossfade-testkit.workspace = true
# Fixtures are written by the engine's own muxers, so the tests read real FLAC and AIFF.
crossfade-format.workspace = true
crossfade-codec.workspace = true
crossfade-flac.workspace = true

[features]
aac = ["crossfade-app/aac"]

[lints]
workspace = true
