[package]
name = "crossfade-ffi"
description = "The C interface native mobile apps use to drive Crossfade's app layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# Static for an iOS XCFramework, dynamic for Android and for loading in tests, rlib for Rust tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
crossfade-app.workspace = true
crossfade-core.workspace = true
crossfade-graph.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# The parity tests: a sheet driven through the C functions must build the CLI's request.
crossfade-cli.workspace = true
crossfade-testkit.workspace = true
# Builds an Ogg Vorbis file for the inspector's test.
crossfade-vorbis.workspace = true
insta.workspace = true
proptest.workspace = true

[features]
aac = ["crossfade-app/aac"]

# The workspace's lints, less `unsafe_code = "forbid"`: this crate alone may cross the C ABI.
# The crate root denies `unsafe_code`; only the ABI module allows it.
[lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cast_lossless = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
