# XcodeGen spec for the Crossfade iOS app: `just ios-project` writes Crossfade.xcodeproj from
# it (git-ignored). Signing and the bundle identifier live in Config/Signing.xcconfig.
name: Crossfade
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    # Swift 5 mode: Swift 6's strict concurrency checking is not wanted for a first build.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CrossfadeKit:
    path: CrossfadeKit
targets:
  Crossfade:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Crossfade
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
      # Named here so it is copied whatever XcodeGen's version guesses for its extension.
      - path: Crossfade/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The licences the app carries (the workspace's and the Opus codec's), straight from the
      # repository, and the third-party notices `just ios-framework` writes.
      - path: ../../LICENSE-MIT
        buildPhase: resources
      - path: ../../LICENSE-APACHE
        buildPhase: resources
      - path: ../../crates/crossfade-opus/COPYING
        buildPhase: resources
      - path: Generated/ThirdPartyNotices.txt
        buildPhase: resources
        optional: true
    dependencies:
      - package: CrossfadeKit
        product: CrossfadeKit
      - package: CrossfadeKit
        product: CrossfadeModels
    settings:
      base:
        PRODUCT_NAME: Crossfade
        INFOPLIST_FILE: Crossfade/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
