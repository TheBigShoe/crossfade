[workspace]
resolver = "3"
members = ["crates/*"]
# libFuzzer is C++; the fuzz crate stays outside the pure-Rust workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crossfade-core = { path = "crates/crossfade-core", version = "0.0.0" }
crossfade-format = { path = "crates/crossfade-format", version = "0.0.0" }
crossfade-codec = { path = "crates/crossfade-codec", version = "0.0.0" }
crossfade-dsp = { path = "crates/crossfade-dsp", version = "0.0.0" }
crossfade-graph = { path = "crates/crossfade-graph", version = "0.0.0" }
crossfade-app = { path = "crates/crossfade-app", version = "0.0.0" }
crossfade-cli = { path = "crates/crossfade-cli", version = "0.0.0" }
appconfig = { path = "crates/appconfig", version = "0.0.0" }
crossfade-testkit = { path = "crates/crossfade-testkit", version = "0.0.0" }
crossfade-ui = { path = "crates/crossfade-ui", version = "0.0.0" }

serde = "1.0.228"
serde_json = "1.0.150"
crossbeam-channel = "0.5"
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
notify = "8"
notify-debouncer-full = "0.7"
parking_lot = "0.12"
tracing = "0.1"
sha2 = "0.10"
toml = "0.8"

libm = "0.2"
thiserror = "2"
proptest = "1"
# Ctrl-C and SIGTERM in the CLI only (MIT OR Apache-2.0); never an engine crate.
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive"] }
insta = "1"
assert_cmd = "2"
criterion = { version = "0.5", default-features = false }
# FLAC encoding. No default features: no threads, no serde.
flacenc = { version = "=0.5.1", default-features = false }

# GPUI through one facade (brings gpui-pre 0.3.12). Import it only via crossfade_ui::prelude.
gpui-kit = "=0.9.1"
# Worker threads wake the UI through it.
async-channel = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cast_lossless = "warn"
semicolon_if_nothing_returned = "warn"
