name: ci

# Manual only for now: hosted CI is deferred until the cross-OS task starts.
# Restore `push` and `pull_request` triggers then.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs that toolchain on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-ios aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build engine crates for mobile targets
        run: |
          for t in aarch64-apple-ios aarch64-linux-android; do
            cargo build --target "$t" -p crossfade-core -p crossfade-format -p crossfade-codec -p crossfade-flac -p crossfade-aac -p crossfade-alac -p crossfade-vorbis -p crossfade-opus -p crossfade-loudness -p crossfade-resample -p crossfade-mp3 -p crossfade-dsp -p crossfade-graph
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --fail-under-lines 87
      - run: cargo llvm-cov -p crossfade-core --fail-under-lines 90

  # Nightly is needed only here; every other job uses rust-toolchain.toml.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo fetch --manifest-path fuzz/Cargo.toml --locked
      # install-action's cargo-fuzz is a musl build; pin the gnu target explicitly.
      - name: Smoke-fuzz each target
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- \
              -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=256
          done
