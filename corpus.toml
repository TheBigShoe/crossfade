# Crossfade conformance corpus manifest.
#
# Official FLAC decoder test files from the IETF CELLAR working group
# (https://github.com/ietf-wg-cellar/flac-test-files), pinned at one commit
# and licensed CC0-1.0. They are too large to commit, so they live in a
# cache that is never checked in.
#
# Fetch once:   just corpus          (cargo run --release -p crossfade-corpus -- fetch)
# Verify:       just corpus-verify
# Offline:      crossfade-corpus seed --from <local clone of the suite>
#
# Cache: $CROSSFADE_CORPUS_DIR, else <workspace>/.corpus-cache.
# Every file is checked by size and SHA-256 before use.
#
# expect = "decode"           must decode to the end and match the stored MD5
#          "decode-or-reject" decodes correctly or returns an error; never wrong audio, never a panic
#          "no-panic"         must not panic or hang; any result is acceptable
#
# Generated once from a local clone of the pinned commit (sizes and hashes
# computed from the files, MD5 from STREAMINFO via metaflac); this file is
# the source of truth.

