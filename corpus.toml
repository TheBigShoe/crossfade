# Opus: the RFC 8251 test vectors, one archive (opus_testvectors-rfc8251.tar.gz) of which
# only the members named here are extracted. testvectorNN.bit is the stream in the Opus
# demo's framing (per packet a 4-byte big-endian length, a 4-byte final-range value, then
# the packet); testvectorNN.dec and testvectorNNm.dec are the two accepted reference
# decodes. All are expect = "data": Opus conformance is a comparison made by the Opus
# test, never by a decode alone. Pass criterion: opus_compare quality >= 0 against the
# .dec or the m.dec file (RFC 6716 section 6, RFC 8251); decodes need not match bit for bit.

