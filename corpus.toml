# Crossfade conformance corpus manifest.
#
# The official test vectors for FLAC, Opus, Vorbis, MP3 and AAC. They are too big to
# commit, and some may not be redistributed, so nothing here is checked in: this file
# lists where each one is, its size and SHA-256, and the cache holds the bytes.
#
# Fetch all:    just corpus          (cargo run --release -p crossfade-corpus -- fetch)
# Fetch some:   crossfade-corpus fetch --only flac/ --only opus/   (id prefixes; also on
#               verify, list and seed; with no flag a fresh clone downloads about 550 MB and the
#               cache ends at about 600 MB: FLAC 310, AAC 73, Opus 127, Vorbis 53, MP3 39)
# Verify:       just corpus-verify
# Offline:      crossfade-corpus seed --from <dir or archive file>   (a mirror, a local
#               clone of a suite, or the Opus tar.gz itself; every file is still verified)
#
# Cache: $CROSSFADE_CORPUS_DIR, else <workspace>/.corpus-cache; a file is at
# <cache>/<id>/<name>. Every file is checked by size and SHA-256 before use, and an
# error says what a wrong download was (the ISO server answers a wrong URL with status
# 200 and an HTML page).
#
# Schema. A file is fetched on its own:
#   [[file]]  id = "<codec>/<suite>/<name>"  name  url  bytes  sha256  licence  expect  [md5]
# or is one member of an archive, which is downloaded once, verified, and read for only
# the members named here (paths come from this file, never from the archive; the archive
# is deleted once every member is in):
#   [[archive]]  id  url  bytes  sha256  licence  format = "tar.gz"
#   [[file]]  id  name  archive = "<archive id>"  member = "<path in the archive>"  bytes  sha256  licence  expect
#
# expect = "decode"           must decode to the end and match the stored MD5
#          "decode-or-reject" decodes correctly or returns an error; never wrong audio, never a panic
#          "no-panic"         must not panic or hang; any result is acceptable
#          "data"             fetched and verified, never decoded by itself: a reference output,
#                             or a stream whose test lives in the codec's own conformance test
#
# Generated once from the files themselves (sizes and hashes computed from the bytes, URLs
# from the publishers' directory listings, each confirmed with a HEAD request); this file
# is the source of truth.

# FLAC: the official decoder test files from the IETF CELLAR working group
# (https://github.com/ietf-wg-cellar/flac-test-files), pinned at one commit, CC0-1.0.
# Pass criterion: see expect; MD5 is the STREAMINFO MD5 (read with metaflac).

